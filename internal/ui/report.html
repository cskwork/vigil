<!doctype html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>QA 검증 리포트</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 폰트는 첫 페인트를 막지 않게 불러옵니다. CDN에 닿지 못하면 theme.css의 시스템 한국어 폰트로 그려집니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<link rel="stylesheet" href="/ui/theme.css">
</head>
<body class="report">
<div class="shell">
  <nav class="rail" aria-label="주 메뉴">
    <div class="brand"><b>QA 현황판</b><span id="brandTarget">vigil</span></div>
    <ul class="tree">
      <li><a href="/">할 일 <span class="cnt" id="nTodo"></span></a></li>
      <li>
        <a href="/results" class="active">검증 결과 <span class="cnt" id="nBad"></span></a>
        <!-- 리포트는 검증 결과에서 펼쳐 보는 한 장짜리 문서라 그 아래 가지로 둡니다. -->
        <ul class="subtree" aria-label="검증 결과의 하위 화면">
          <li><a href="#main" class="active" aria-current="page">리포트</a></li>
        </ul>
      </li>
      <li><a href="/scripts">검사 스크립트 <span class="cnt" id="nScripts"></span></a></li>
      <li><a href="/activity">시스템 활동</a></li>
      <li><a href="/help">도움말</a></li>
    </ul>
    <!-- 개발자 정보를 켜면 검사 이름과 실행 번호, 증적 경로가 함께 인쇄됩니다.
         개발자에게 리포트를 넘길 때 쓰고, 평소에는 꺼 둔 채로 출력합니다. -->
    <details class="rail-foot" id="railPrefs" open>
      <summary>화면 설정</summary>
      <label>화면 <select id="theme" aria-label="화면 모드"><option value="auto">시스템</option><option value="light">밝게</option><option value="dark">어둡게</option></select></label>
      <label>표시 밀도 <select id="density" aria-label="표시 밀도"><option value="comfortable">편안하게</option><option value="compact">촘촘하게</option></select></label>
      <label><span>개발자 정보</span><input type="checkbox" id="devmode"></label>
    </details>
  </nav>
  <div class="content">
    <header class="topbar">
      <div class="crumbs">QA 현황판 &rsaquo; 검증 결과 &rsaquo; <b>리포트</b></div>
      <div class="fresh"><button class="btn" id="copyMd">Markdown 복사</button><button class="btn primary" onclick="window.print()">인쇄 / PDF</button></div>
    </header>
    <main>
      <div id="fetchErr"></div>
      <section class="panel"><div class="body">
        <div class="report-h" id="head"><div class="skel" style="width:50%"></div></div>
        <table><thead><tr><th>검사 항목</th><th class="fit">결과</th><th class="fit">검증 시각</th><th>증거</th></tr></thead><tbody id="matrix"><tr><td colspan="4"><div class="skel"></div></td></tr></tbody></table>
      </div></section>
      <section class="panel"><header><h2>항목별 증거</h2><p>단계, 검증 당시 화면, 서버 응답 중 문제된 것</p></header><div class="body" id="details"><div class="skel"></div></div></section>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/ui/app.js"></script>
<script>
const marker = new URLSearchParams(location.search).get('marker') || '';
let data = null;

async function load() {
  try {
    const r = await fetch('/api/verification' + (marker ? '?marker=' + encodeURIComponent(marker) : ''), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
    render();
  } catch (e) { $('fetchErr').innerHTML = `<div class="errbox"><span>리포트를 만들지 못했습니다 (${esc(e.message)})</span><button class="btn" id="retryBtn">다시 시도</button></div>`; $('retryBtn').onclick = load; }
}

async function render() {
  const o = data, checks = o.checks || [], dep = (o.deployments || []).find(d => d.marker === o.marker);
  const v = checks.filter(c => !c.not_verified), p = v.filter(c => c.outcome === 'PASS' || c.outcome === 'QA_FLAKE');
  setTarget(o.target);
  document.title = `QA 검증 리포트 ${o.marker}`;
  $('head').innerHTML = `<h1>QA 검증 리포트</h1><p>대상 ${esc(o.target)} · 배포 마커 <span class="mono">${esc(o.marker || '없음')}</span>${dep ? ` · 처음 확인 ${esc(dep.first_seen)} · 마지막 검증 ${esc(dep.last_seen)}` : ''}</p><p style="margin-top:8px">${st({ ok: ['정상', 'ok'], bad: ['문제 있음', 'bad'], warn: ['확인 필요', 'warn'], idle: ['결과 없음', 'muted'] }, !v.length ? 'idle' : v.some(c => c.outcome === 'APP_FAILURE') || (o.incidents || []).length ? 'bad' : p.length === v.length ? 'ok' : 'warn')} 검증 ${p.length}/${v.length} 정상, 미실행 ${checks.length - v.length}, 미해결 문제 ${(o.incidents || []).length}건 · 생성 ${new Date().toLocaleString('ko-KR')}</p>`;
  $('matrix').innerHTML = checks.map(c => `<tr><td><div class="t">${esc(c.title || c.scenario_id)}</div><div class="sub">${esc(CLASS[c.class] || c.class)} ${envBadge(c.environment)} ${dev(c.scenario_id + (c.version ? ' v' + c.version : '') + (c.run_id ? ' run#' + c.run_id : ''))}</div></td><td class="st-cell">${c.not_verified ? st({ x: ['미실행', 'muted'] }, 'x') : st(OUTCOME, c.outcome)}</td><td class="fit">${esc(c.finished_at || '')}</td><td class="sub">${c.not_verified ? '' : [c.screenshot ? (c.browser === 'lightpanda' ? '화면 캡처(텍스트 렌더링)' : '화면 캡처') : '', c.steps ? `단계 ${c.steps}` : '', c.requests ? `서버 응답 ${c.requests}` : '', c.console_errors ? `콘솔 오류 ${c.console_errors}` : ''].filter(Boolean).join(' · ')}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">검사 항목이 없습니다.</td></tr>';

  // evidence bundles load in parallel; each run dir is immutable and cacheable
  const verified = checks.filter(c => !c.not_verified);
  const bundles = await Promise.all(verified.map(async c => { try { const r = await fetch('/api/run/detail?dir=' + encodeURIComponent(c.evidence_rel)); return r.ok ? await r.json() : {}; } catch { return {}; } }));
  const parts = verified.map((c, i) => {
    const d = bundles[i];
    const bad = (d.network || []).filter(n => n.failed || n.status >= 400);
    return `<div class="check"><h3>${esc(c.title || c.scenario_id)} ${st(OUTCOME, c.outcome)} <span class="sub">${esc(c.finished_at)} · ${(c.duration_ms / 1000).toFixed(1)}초 · ${esc(BROWSER[c.browser] || c.browser)}</span> ${envBadge(c.environment)}</h3>
      ${c.cause ? `<p class="cause-l1">${st(CAUSE_KIND, c.cause.kind)}<span class="cause-line">${esc(c.cause.headline)}</span></p><p class="sub">${esc(c.cause.why)} ${esc(c.cause.next)}</p>` : ''}
      <p class="sub dev">${c.environment ? `환경: ${esc(c.environment)} · ` : ''}증적: <a href="/evidence/${esc(c.evidence_rel)}/" target="_blank" rel="noopener">${esc(c.evidence_rel)}</a></p>
      ${stepsHTML((d.steps && d.steps.steps) || [])}
      ${bad.length ? `<p class="sub" style="margin:8px 0 4px">문제된 서버 응답 ${bad.length}건</p><table class="net"><tbody>${bad.map(n => `<tr><td class="fit">${esc(n.method)}</td><td class="num">${n.failed ? '실패' : n.status}</td><td class="url">${esc(n.url)}</td></tr>`).join('')}</tbody></table>` : ''}
      ${(d.screenshots || []).length ? `${c.browser === 'lightpanda' ? '<p class="sub" style="margin:8px 0 4px">가벼운 브라우저의 텍스트 렌더링 캡처 (실제 화면 아님)</p>' : ''}<div class="shots" style="margin-top:10px">${d.screenshots.map(s => `<figure><img src="/evidence/${esc(s)}" alt="검증 당시 화면"><figcaption>${esc(s.split('/').pop())}</figcaption></figure>`).join('')}</div>` : ''}
    </div>`;
  });
  $('details').innerHTML = parts.join('') || '<div class="empty">이 배포에서 실행된 검사가 없습니다.</div>';
}

$('copyMd').onclick = async () => {
  const o = data, checks = o.checks || [], dep = (o.deployments || []).find(d => d.marker === o.marker);
  const v = checks.filter(c => !c.not_verified), p = v.filter(c => c.outcome === 'PASS' || c.outcome === 'QA_FLAKE');
  // 머리말은 검증 결과 화면의 Markdown 복사와 같은 규칙입니다. 이 화면은 조건으로
  // 좁히는 기능이 없으므로 '적용한 조건' 줄은 나오지 않습니다.
  const L = [`# QA 검증 결과: ${o.target}`, `- 배포 표시: \`${o.marker}\`${dep ? ` (처음 확인 ${dep.first_seen}, 마지막 검증 ${dep.last_seen})` : ''}`, `- 결과: ${p.length}/${v.length} 정상, 미실행 ${checks.length - v.length}, 미해결 문제 ${(o.incidents || []).length}건, 데이터 발견 사항 ${o.open_findings || 0}건`, `- 생성: ${new Date().toLocaleString('ko-KR')}`, '', '| 검사 항목 | 결과 | 검증 시각 | 증거 |', '|---|---|---|---|'];
  for (const c of checks) { const res = c.not_verified ? '미실행' : (OUTCOME[c.outcome] || [c.outcome])[0]; L.push(`| ${c.title || c.scenario_id} | ${res} | ${c.finished_at || ''} | ${c.not_verified ? '' : [c.screenshot ? (c.browser === 'lightpanda' ? '화면(텍스트 렌더링)' : '화면') : '', c.steps ? `단계 ${c.steps}` : '', c.requests ? `응답 ${c.requests}` : ''].filter(Boolean).join(', ')} |`); }
  try { await navigator.clipboard.writeText(L.join('\n')); toast('Markdown을 복사했습니다.'); } catch { toast('복사에 실패했습니다. 화면 내용을 선택해 복사하세요.'); }
};
// 레일 배지는 다른 화면과 같은 자리에서 같은 뜻(사람이 손대야 하는 건수)을 말합니다.
// 다만 이 화면은 인쇄해서 남기는 한 장짜리 스냅숏이라, 되풀이 폴링 대신 한 번만
// 읽습니다. 읽지 못하면 잘못된 0 대신 배지를 비워 둡니다.
(async () => {
  try {
    const r = await fetch('/api/todo', { cache: 'no-cache' });
    if (r.ok) railCounts((await r.json()).counts);
  } catch (_) { /* 배지 없이 그대로 둡니다 */ }
})();

load();
</script>
</body>
</html>
