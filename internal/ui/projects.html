      <div class="crumbs">Vigil 관리 콘솔 &rsaquo; <b>프로젝트·사이트</b></div>
      <div class="fresh"><span class="live" id="live" aria-hidden="true"></span><span id="freshText">연결 중</span></div>
    </header>
    <main id="main" tabindex="-1">
      <div class="overview-heading"><div><h1>프로젝트·사이트</h1><p>프로젝트별 검증 대상과 기본 사이트를 관리합니다.</p></div><button class="btn primary" id="newProject">프로젝트 추가</button></div>
      <div id="fetchErr"></div>
      <div class="settings-layout"><nav class="project-list" id="projectList" aria-label="등록된 프로젝트"></nav><section class="panel"><header><h2 id="formTitle">프로젝트 정보</h2></header>
      <form id="projectForm" class="admin-form"><div class="form-grid"><label>프로젝트 이름<input id="projectNameInput" maxlength="80" required placeholder="예: 네이버 서비스"></label><details class="advanced"><summary>고급 설정 · 프로젝트 ID</summary><label>프로젝트 ID<input id="projectID" required pattern="[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}" maxlength="64" placeholder="자동 생성"></label></details></div><div id="siteEditors"></div><button type="button" class="btn" id="addSite">사이트 추가</button><div class="form-actions"><p class="form-note">변경한 URL은 다음 실행부터 적용됩니다.</p><button class="btn primary" id="saveProject">변경사항 저장</button></div><p id="saveFeedback" class="qa-feedback" role="status"></p></form>
      </section></div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/ui/app.js"></script>
<script>
let registry=null, editing=null, saving=false;
const newSite = (n) => ({id:n===0?'main':'site-'+crypto.randomUUID().slice(0,8),name:n===0?'메인 사이트':'',url:'',allowed_hosts:[],read_only:true});
function collectSites(){return [...document.querySelectorAll('.site-editor')].map((el,i)=>({id:el.querySelector('[name=siteID]').value.trim(),name:el.querySelector('[name=siteName]').value.trim(),url:el.querySelector('[name=siteURL]').value.trim(),allowed_hosts:el.querySelector('[name=hosts]').value.split(',').map(x=>x.trim()).filter(Boolean),read_only:el.querySelector('[name=readOnly]').checked,primary:el.querySelector('[name=primary]').checked}));}
function renderSites(sites){$('siteEditors').innerHTML=sites.map((s,i)=>`<section class="site-editor"><h3>사이트 ${i+1}</h3><div class="form-grid"><label>사이트 이름<input name="siteName" value="${esc(s.name)}" required maxlength="80" placeholder="예: 운영 사이트"></label><label>검증 URL<input name="siteURL" type="url" value="${esc(s.url)}" placeholder="https://www.naver.com/" required></label></div><label class="inline"><input type="radio" name="primary" value="${i}" ${(s.primary??(editing?.default_site===s.id||!editing&&i===0))?'checked':''}>기본 검증 사이트</label><details class="advanced"><summary>고급 설정 · 접근 범위와 사이트 ID</summary><div class="form-grid"><label>사이트 ID<input name="siteID" value="${esc(s.id)}" ${editing?.sites.some(old=>old.id===s.id)?'readonly':''} required pattern="[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}" maxlength="64"></label><label>추가 허용 호스트<input name="hosts" value="${esc((s.allowed_hosts||[]).join(', '))}" placeholder="예: search.naver.com"></label></div><p class="form-note">URL의 호스트는 자동으로 허용됩니다. 다른 호스트로 이동해야 할 때만 추가하세요.</p><label class="inline"><input type="checkbox" name="readOnly" ${s.read_only?'checked':''}>읽기 전용 검사만 허용</label></details></section>`).join('');}

function editProject(p){editing=p?structuredClone(p):null;$('formTitle').textContent=p?'프로젝트 정보':'새 프로젝트';$('projectID').value=p?.id||'project-'+crypto.randomUUID().slice(0,8);$('projectID').readOnly=!!p;$('projectNameInput').value=p?.name||'';$('saveFeedback').textContent='';$('saveProject').textContent=p?'변경사항 저장':'프로젝트 등록';renderSites(p?.sites||[newSite(0)]);renderList();}
function renderList(){$('projectList').innerHTML=(registry?.projects||[]).map(p=>`<button type="button" data-project="${esc(p.id)}" aria-current="${editing?.id===p.id}">${esc(p.name)}<small>${p.sites.length}개 사이트</small></button>`).join('');for(const b of $('projectList').querySelectorAll('button'))b.onclick=()=>{if(!saving)editProject(registry.projects.find(p=>p.id===b.dataset.project))};}
$('newProject').onclick=()=>{if(!saving){editProject(null);$('projectNameInput').focus()}};
$('addSite').onclick=()=>{const sites=collectSites();sites.push(newSite(sites.length));renderSites(sites)};
$('projectForm').onsubmit=async e=>{e.preventDefault();if(saving)return;const sites=collectSites(),primary=sites.find(s=>s.primary);if(!primary){$('saveFeedback').textContent='기본 검증 사이트를 선택하세요.';return}const p={id:$('projectID').value.trim(),name:$('projectNameInput').value.trim(),revision:editing?.revision||0,default_site:primary.id,sites:sites.map(({primary,...s})=>s)};saving=true;$('saveProject').disabled=true;$('saveFeedback').textContent='저장 중입니다.';try{const r=await fetch('/api/projects',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});if(!r.ok)throw await httpFail(r,'프로젝트를 저장하지 못했습니다.');await r.json();location.href='/projects?project='+encodeURIComponent(p.id)}catch(e){$('saveFeedback').textContent=e.message;$('saveFeedback').className='qa-feedback error'}finally{saving=false;$('saveProject').disabled=false}};
projectRegistry.then(r=>{registry=r;if(!r){$('fetchErr').innerHTML='<p class="errbox">프로젝트 관리 서버에 연결하지 못했습니다. 페이지를 새로고침하세요.</p>';$('saveProject').disabled=true;return}editProject(r.projects.find(p=>p.id===(selectedProject||r.default_project))||r.projects[0]);});
</script>
</body></html>
