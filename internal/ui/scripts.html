<!doctype html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>검사 스크립트, QA 현황판</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 폰트는 첫 페인트를 막지 않게 불러옵니다. CDN에 닿지 못하면 theme.css의 시스템 한국어 폰트로 그려집니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<link rel="stylesheet" href="/ui/theme.css">
</head>
<body>
<a class="skiplink" href="#main">본문으로 건너뛰기</a>
<div class="shell">
  <nav class="rail" aria-label="주 메뉴">
    <div class="brand"><b>QA 현황판</b><span id="brandTarget">vigil</span></div>
    <ul class="tree">
      <li><a href="/">할 일 <span class="cnt" id="nTodo"></span></a></li>
      <li><a href="/results">검증 결과 <span class="cnt" id="nBad"></span></a></li>
      <li><a href="/scripts" class="active" aria-current="page">검사 스크립트 <span class="cnt" id="nScripts"></span></a></li>
      <li><a href="/activity">시스템 활동</a></li>
      <li><a href="/help">도움말</a></li>
    </ul>
    <details class="rail-foot" id="railPrefs" open>
      <summary>화면 설정</summary>
      <label>화면 <select id="theme" aria-label="화면 모드"><option value="auto">시스템</option><option value="light">밝게</option><option value="dark">어둡게</option></select></label>
      <label>표시 밀도 <select id="density" aria-label="표시 밀도"><option value="comfortable">편안하게</option><option value="compact">촘촘하게</option></select></label>
      <label><span>개발자 정보</span><input type="checkbox" id="devmode"></label>
    </details>
  </nav>
  <div class="content">
    <header class="topbar">
      <div class="crumbs">QA 현황판 &rsaquo; 검사 스크립트</div>
      <div class="search"><input type="search" id="q" placeholder="스크립트 검색 (제목, 이름, 연결)" aria-label="스크립트 검색"></div>
      <div class="fresh"><span class="live" id="live" aria-hidden="true"></span><span id="freshText">연결 중</span></div>
    </header>
    <main id="main" tabindex="-1">
      <div id="fetchErr"></div>
      <div class="page-head">
        <h1>검사 스크립트</h1>
        <p class="purpose">자동 검사 절차를 보고, 실행하고, 승인합니다. <a href="/help#state">이 화면의 말이 궁금하면 도움말</a></p>
      </div>
      <div class="split single" id="split">
        <section class="panel list-panel" aria-label="스크립트 목록">
          <header><h2>전체 목록</h2><p>한 줄이 검사 하나입니다. 상태를 눌러 골라 보세요.</p></header>
          <div class="chipbar"><div class="chips" id="chips" role="group" aria-label="상태로 걸러 보기"></div><span class="count" id="count" aria-live="polite"></span></div>
          <p class="chipdesc" id="chipDesc"></p>
          <div class="body">
            <table class="list-table">
              <caption class="sr-only">검사 스크립트 목록</caption>
              <!-- 로딩 뼈대는 항상 있는 세 열만 그립니다. '할 수 있는 일' 열은 조작할 수
                   있는 행이 있을 때만 생기므로, 여기에 미리 그리면 다 불러온 뒤 머리글 수가
                   줄어 보입니다. -->
              <thead id="head"><tr><th scope="col">스크립트</th><th scope="col" class="fit">상태</th><th scope="col" class="fit" aria-sort="none"><button type="button" class="sortbtn" data-sort="last">최근 결과<span class="sarr" aria-hidden="true">↕</span></button></th></tr></thead>
              <tbody id="list" aria-busy="true">
                <tr><td><div class="skel skel-line" style="width:72%"></div></td><td class="fit"><div class="skel skel-chip"></div></td><td class="fit"><div class="skel skel-chip" style="width:5em"></div></td></tr>
                <tr><td><div class="skel skel-line" style="width:58%"></div></td><td class="fit"><div class="skel skel-chip"></div></td><td class="fit"><div class="skel skel-chip" style="width:5em"></div></td></tr>
                <tr><td><div class="skel skel-line" style="width:66%"></div></td><td class="fit"><div class="skel skel-chip"></div></td><td class="fit"><div class="skel skel-chip" style="width:5em"></div></td></tr>
                <tr><td><div class="skel skel-line" style="width:48%"></div></td><td class="fit"><div class="skel skel-chip"></div></td><td class="fit"><div class="skel skel-chip" style="width:5em"></div></td></tr>
              </tbody>
            </table>
            <div class="more" id="more"></div>
          </div>
        </section>
        <section class="panel detail" aria-label="스크립트 상세" id="detail" hidden></section>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/ui/app.js"></script>
<script>
// Status chips replace the old selects: one click filters, and the choice is in
// the address bar so a link can point at "승인 대기".
const CHIPS = [
  { key: 'PENDING_APPROVAL', label: '승인 대기', states: ['PENDING_APPROVAL'],
    desc: () => '사람이 확인하고 승인해야 자동 실행이 시작됩니다.',
    empty: '승인 기다리는 검사가 없습니다. 확인하고 싶은 화면이 있으면 <a href="/#qaIntake">할 일 화면에서 직접 확인 요청하기</a>에 상황을 적어 주세요. Jira 이슈나 운영 로그에서 만들어진 검사도 여기에 옵니다.',
    cmd: '터미널에서는 <span class="mono">vigil reproduce &lt;이슈 키&gt;</span>로 이슈 증상을 재현합니다.' },
  { key: 'ACTIVE', label: '정식 검사', states: ['ACTIVE'],
    desc: (at) => `이 검사들은 매일 ${at}과 배포 직후에 자동으로 실행됩니다. 실패하면 할 일 화면에 올라옵니다.`,
    empty: '매일 자동으로 도는 검사가 아직 없습니다. <a href="/scripts?state=PENDING_APPROVAL">승인 대기</a>에서 검사를 승인하면 여기로 옵니다.',
    cmd: '터미널에서는 <span class="mono">vigil approve &lt;검사 이름&gt;</span>으로 승인합니다.' },
  { key: 'SOAK', label: '안정화 중', states: ['SOAK'],
    desc: () => '연속으로 통과하면 정식 검사가 됩니다. 줄마다 남은 횟수를 적어 두었습니다.',
    empty: '안정화 중인 검사가 없습니다. AI가 새로 만든 검사가 연속 통과를 쌓는 단계라, 새 검사가 생기면 여기를 거쳐 갑니다.',
    cmd: '터미널에서는 <span class="mono">vigil discover</span>로 새 검사를 찾게 할 수 있습니다.' },
  { key: 'NEEDS_REVIEW', label: '확인 필요', states: ['NEEDS_REVIEW'],
    desc: () => 'AI가 스스로 고치지 못한 검사입니다. 증거를 보고 승인하거나 반려해 주세요.',
    empty: '사람 손이 필요한 검사가 없습니다. 좋은 상태입니다.' },
  { key: 'QUARANTINED', label: '잠시 제외', states: ['QUARANTINED'],
    desc: () => '결과가 들쭉날쭉해 자동 실행에서 빠진 검사입니다. 절차를 고친 뒤 다시 승인해 주세요.',
    empty: '불안정해서 빠진 검사가 없습니다. 좋은 상태입니다.' },
  // 칩의 숫자는 할 일 카드가 약속한 것과 같은 미해결 발견 사항 건수이고, 목록은 그
  // 사항이 달린 검사입니다. 한 검사에 여러 건이 달릴 수 있어 두 수가 다를 수 있습니다.
  { key: 'FINDINGS', label: '발견 사항', match: (s) => (s.open_findings || 0) > 0,
    count: (all) => all.reduce((n, s) => n + (s.open_findings || 0), 0),
    desc: () => '화면 값과 서버 응답을 대조해 찾은 이상한 점입니다. 칩의 숫자는 미해결 발견 사항 건수이고, 아래 목록은 그 사항이 달린 검사입니다. 제목을 누르면 상세의 발견 사항 구역으로 이동합니다.',
    empty: '미해결 발견 사항이 남은 검사가 없습니다. 좋은 상태입니다.',
    cmd: '터미널에서는 <span class="mono">vigil findings</span>로 전체 목록을 봅니다.' },
  { key: 'EXCLUDED', label: '쓰지 않음', states: ['EPHEMERAL', 'DUPLICATE', 'REJECTED', 'RETIRED', 'MERGED', 'SUPERSEDED'],
    desc: () => '중복이거나 반려돼서 실행하지 않는 검사입니다.',
    empty: '중복이거나 반려된 검사가 없습니다.',
    cmd: '터미널에서는 <span class="mono">vigil reject &lt;검사 이름&gt;</span>으로 반려합니다.' },
  { key: 'ALL', label: '전체', states: null,
    desc: () => '모든 검사입니다. 상태 칩을 눌러 필요한 것만 볼 수 있습니다.',
    empty: '검사가 하나도 없습니다. 확인하고 싶은 화면이 있으면 <a href="/#qaIntake">할 일 화면에서 직접 확인 요청하기</a>에 상황을 적어 주세요. AI가 대신 눌러 보고 검사 절차를 만듭니다.',
    cmd: '터미널에서는 <span class="mono">vigil add</span>로 직접 쓰거나 <span class="mono">vigil discover</span>로 AI에게 맡길 수 있습니다.' },
];
const PAGE_SIZE = 20;

const params = new URLSearchParams(location.search);
let data = null, selected = params.get('id') || null, selectedVersion = null,
  queryRaw = params.get('q') || '', query = queryRaw.trim().toLowerCase(),
  chip = params.get('state') || '', chipTouched = !!chip, shown = PAGE_SIZE, popover = null,
  sort = parseSort(params.get('sort'));
$('q').value = queryRaw;

$('q').oninput = (e) => { queryRaw = e.target.value; query = queryRaw.trim().toLowerCase(); shown = PAGE_SIZE; syncURLSoon(); render(); };
// Escape 는 팝오버를 닫고 스스로 포커스를 옮기므로 render() 를 그대로 씁니다.
// 공용 단축키 층에는 팝오버가 열려 있다고 알려, Escape 를 가로채지 않게 합니다.
addEscGuard(() => !!popover);
document.addEventListener('keydown', (e) => { if (e.isComposing) return; if (e.key === 'Escape' && popover) { const id = popover.id; popover = null; render(); focusAction(id); } });

// 폴링 재렌더는 읽던 자리를 지키기만 하고 포커스는 옮기지 않습니다.
const poll = poller({ url: '/api/scripts', every: 10000, onData: (d, changed) => { data = d; setTarget(d.target); if (changed) rerender(render, { focus: false }); }, tick: { every: 60000, fn: () => { if (data) rerender(render, { focus: false }); } } });

function chipFor(key) { return CHIPS.find(c => c.key === key) || CHIPS[CHIPS.length - 1]; }
// 빈 화면은 이 화면에서 할 수 있는 일을 먼저 말하고, 같은 일을 하는 터미널 명령은
// 개발자 정보를 켠 사람에게만 보입니다.
function emptyHTML(c) { return c.empty + (c.cmd ? `<p class="dev sub">${c.cmd}</p>` : ''); }
// A chip filters by state list, or by a predicate when the question is not a
// state at all (발견 사항 같은 조건).
function chipMatch(c, s) { return c.match ? c.match(s) : (!c.states || c.states.includes(s.state)); }
function inChip(s, key) { return chipMatch(chipFor(key), s); }

// 주소에 남기는 것: 상태 칩(state), 열린 항목(id), 검색어(q), 정렬(sort).
// 기존 파라미터 이름은 할 일 화면의 카드가 가리키므로 그대로 둡니다.
function syncURL() {
  const p = new URLSearchParams();
  if (chip) p.set('state', chip);
  if (selected) p.set('id', selected);
  if (queryRaw.trim()) p.set('q', queryRaw.trim());
  if (sort) p.set('sort', sortParam(sort));
  history.replaceState(null, '', p.toString() ? '?' + p.toString() : location.pathname);
}
const syncURLSoon = debounce(syncURL, 300);
// 정렬은 불러오는 동안에도 눌러 둘 수 있습니다. 데이터가 없으면 render 가 곧장 돌아옵니다.
const setSort = (s) => { sort = s; shown = PAGE_SIZE; syncURL(); rerender(render); };
bindSort($('head'), () => sort, setSort);

function render() {
  if (!data) return;
  const all = data.scripts || [];
  const counts = {};
  for (const c of CHIPS) counts[c.key] = c.count ? c.count(all) : all.filter(s => chipMatch(c, s)).length;
  // default view: whatever needs a person, else the checks that actually run
  if (!chipTouched) { chip = counts.PENDING_APPROVAL > 0 ? 'PENDING_APPROVAL' : 'ACTIVE'; }
  if (!counts[chip] && chip !== 'ALL' && !chipTouched) chip = 'ALL';

  $('chips').innerHTML = CHIPS.map(c => `<button type="button" data-c="${c.key}" aria-pressed="${chip === c.key}">${esc(c.label)}<span class="n">${counts[c.key] || 0}</span></button>`).join('');
  $('chips').querySelectorAll('button').forEach(b => b.onclick = () => { chip = b.dataset.c; chipTouched = true; shown = PAGE_SIZE; popover = null; syncURL(); rerender(render); });

  const matched = all.filter(s => inChip(s, chip)
    && (!query || (s.title || '').toLowerCase().includes(query) || s.id.toLowerCase().includes(query) || (s.links || []).some(l => l.LinkValue.toLowerCase().includes(query))));
  // 정렬을 누르지 않으면 서버가 준 순서 그대로입니다.
  const rows = sortRows(matched, sort, { last: (s) => s.last_run_at || '' });
  const page = rows.slice(0, shown);
  $('count').textContent = `${rows.length}개 표시 · 전체 ${all.length}개`;
  $('chipDesc').textContent = chipFor(chip).desc((data && data.daily_at) || '09:00');
  // The action column only exists when something in view can be acted on, so no
  // row shows an empty control.
  const acts = rows.some(s => ACTIONABLE.includes(s.state));
  const cols = acts ? 4 : 3;
  $('head').innerHTML = `<tr><th scope="col">스크립트</th><th scope="col" class="fit">상태</th>${sortTh(sort, 'last', '최근 결과', 'fit')}${acts ? '<th scope="col" class="fit">할 수 있는 일</th>' : ''}</tr>`;
  bindSort($('head'), () => sort, setSort);
  $('list').removeAttribute('aria-busy');
  $('list').innerHTML = page.length ? page.map(s => rowHTML(s, acts)).join('')
    : `<tr><td colspan="${cols}" class="empty"><b>${query ? '검색어에 맞는 스크립트가 없습니다' : chipFor(chip).label + ' 스크립트가 없습니다'}</b>${query ? '검색어를 지우거나 다른 상태를 눌러 보세요.' : emptyHTML(chipFor(chip))}</td></tr>`;
  $('more').innerHTML = rows.length > page.length ? `<button class="btn" id="moreBtn">더 보기 (+${rows.length - page.length})</button>` : '';
  const mb = $('moreBtn'); if (mb) mb.onclick = () => { shown += PAGE_SIZE; rerender(render); };

  // 제목을 눌러 상세를 여는 것도 사용자 조작입니다. 목록이 통째로 다시 그려지므로
  // rerender 로 감싸, 누른 제목에 포커스가 남게 합니다. renderDetail 이 스스로
  // 포커스를 옮기는 경우(좁은 화면, 발견 사항)에는 그 결정을 그대로 둡니다.
  $('list').querySelectorAll('button[data-open]').forEach(b => b.onclick = () => { selected = b.dataset.open; selectedVersion = null; popover = null; syncURL(); rerender(render); });
  $('list').querySelectorAll('button[data-act]').forEach(b => b.onclick = () => {
    const [kind, id] = b.dataset.act.split('|');
    popover = (popover && popover.id === id && popover.kind === kind) ? null : { id, kind };
    render();
    const box = document.querySelector('.pop'); if (box) (box.querySelector('select, button') || box).focus();
  });
  bindPopover();
  renderDetail(all.find(s => s.id === selected));
}

function focusAction(id) { const b = document.querySelector(`button[data-act^="run|${CSS.escape(id)}"]`) || document.querySelector(`button[data-open="${CSS.escape(id)}"]`); if (b) b.focus(); }

const ACTIONABLE = ['PENDING_APPROVAL', 'NEEDS_REVIEW'];

// The "다음에 일어나는 일" line is only worth a row's height where the reader
// waits for something or has to act. For 정식 검사 the same sentence stands once
// above the table (and in the state tooltip).
const NEXT_ON_ROW = ['PENDING_APPROVAL', 'SOAK', 'NEEDS_REVIEW', 'QUARANTINED', 'CANDIDATE'];

function rowHTML(s, acts) {
  const sel = selected === s.id;
  const last = s.last_outcome ? `${stTip(OUTCOME, s.last_outcome)}<div class="sub">${s.last_run_at ? esc(ago(s.last_run_at)) : ''}</div>` : '<span class="sub">실행 기록 없음</span>';
  const next = NEXT_ON_ROW.includes(s.state) ? `<div class="sub next">${esc(nextStep(s, data.daily_at))}</div>` : '';
  const cell = acts ? `<td class="fit actcell">${ACTIONABLE.includes(s.state) ? actionCell(s) : ''}</td>` : '';
  return `<tr class="${sel ? 'sel' : ''}">
    <td class="title"><button class="linklike" data-open="${esc(s.id)}" aria-pressed="${sel}">${esc(s.title || s.id)}</button>
      <div class="sub">${sourceChip(s)} ${esc(CLASS[s.class] || s.class)} · 판정 근거 ${tip(ORACLE[s.oracle] || s.oracle || '없음', GLOSS[s.oracle] || '무엇이 옳은 동작인지 정한 근거가 없습니다.')} ${dev(s.id)}</div>
      ${s.open_findings ? `<div class="sub"><span class="st st-warn"><i></i>발견 사항 ${s.open_findings}건</span></div>` : ''}</td>
    <td class="fit">${stTip(STATE, s.state)}${reproBadge(s)}${next}</td>
    <td class="fit">${last}</td>
    ${cell}</tr>`
    + (popover && popover.id === s.id ? `<tr class="pop-row"><td colspan="${acts ? 4 : 3}">${popHTML(s)}</td></tr>` : '');
}

function actionCell(s) {
  const a = (data && data.actions) || {};
  return `<div class="rowacts">
    <button class="btn" data-act="run|${esc(s.id)}" aria-expanded="${!!(popover && popover.id === s.id && popover.kind === 'run')}" ${a.run ? '' : 'disabled title="이 화면에는 실행기가 붙어 있지 않습니다. vigil loop --ui로 실행하세요"'}><span aria-hidden="true">▶</span> 실행</button>
    <button class="btn primary" data-act="approve|${esc(s.id)}" aria-expanded="${!!(popover && popover.id === s.id && popover.kind === 'approve')}" ${a.approve ? '' : 'disabled'}><span aria-hidden="true">✔</span> 승인</button>
    <button class="btn danger" data-act="reject|${esc(s.id)}" aria-expanded="${!!(popover && popover.id === s.id && popover.kind === 'reject')}" ${a.approve ? '' : 'disabled'}><span aria-hidden="true">✖</span> 반려</button>
    ${a.approve ? '' : `<div class="sub">터미널에서: <span class="mono">vigil approve ${esc(s.id)}</span></div>`}
    ${receipts[s.id] ? `<div class="sub receipt" role="status">${receipts[s.id]}</div>` : ''}</div>`;
}

// small inline panel under the row: run options, or a confirm that names the consequence
function popHTML(s) {
  const envs = (data && data.envs) || [], def = data && data.default_env;
  if (popover.kind === 'run') {
    return `<div class="pop" role="group" aria-label="지금 한 번 실행">
      <p class="sub">지금 한 번만 실행합니다. 상태는 바뀌지 않습니다.</p>
      <label>환경 <select id="actEnv">${envs.map(e => `<option value="${esc(e)}"${e === def ? ' selected' : ''}>${esc(e)}</option>`).join('')}</select></label>
      <label>브라우저 <select id="actBrowser"><option value="lightpanda">${esc(BROWSER.lightpanda)}</option><option value="chromium">${esc(BROWSER.chromium)}</option></select></label>
      <button class="btn primary" id="popGo">실행 대기열에 넣기</button>
      <button class="btn" id="popCancel">취소</button></div>`;
  }
  if (popover.kind === 'approve') {
    const when = `매일 ${esc((data && data.daily_at) || '09:00')}에 자동 실행`;
    const jira = s.source_kind === 'issue' && s.source_ref ? `되고 ${esc(s.source_ref)}에 승인 댓글이 달립니다` : '됩니다';
    const note = s.state === 'NEEDS_REVIEW' ? '안정화 단계부터 다시 시작하고, 연속 통과하면 정식 검사가 됩니다.' : `${when}${jira}.`;
    return `<div class="pop warn" role="group" aria-label="승인 확인">
      <p><b>승인하면 이렇게 됩니다.</b> ${note}</p>
      <button class="btn primary" id="popGo">네, 승인합니다</button>
      <button class="btn" id="popCancel">취소</button></div>`;
  }
  return `<div class="pop warn" role="group" aria-label="반려 확인">
    <p><b>반려하면 이렇게 됩니다.</b> 이 검사는 자동 실행에서 빠지고 목록의 쓰지 않음으로 갑니다. 나중에 다시 승인할 수 있습니다.</p>
    <button class="btn primary" id="popGo">네, 반려합니다</button>
    <button class="btn" id="popCancel">취소</button></div>`;
}

function bindPopover() {
  if (!popover) return;
  const s = (data.scripts || []).find(x => x.id === popover.id); if (!s) return;
  const cancel = $('popCancel'); if (cancel) cancel.onclick = () => { const id = popover.id; popover = null; render(); focusAction(id); };
  const go = $('popGo'); if (!go) return;
  go.onclick = () => {
    const kind = popover.kind;
    const extra = kind === 'run' ? { env: $('actEnv').value, browser: $('actBrowser').value } : {};
    popover = null;
    scriptAction(kind, s, extra);
  };
}

// 승인이나 실행을 마친 뒤 포커스가 갈 자리. 처리한 행이 아직 목록에 있으면 그
// 행의 조작 버튼으로, 상태가 바뀌어 현재 칩에서 빠졌으면 같은 자리의 다음 행
// 제목으로, 목록이 비면 표 위의 안내 문구로 옮깁니다.
function focusAfterAction(id, idx) {
  const b = document.querySelector(`button[data-act^="run|${CSS.escape(id)}"]`) || document.querySelector(`button[data-open="${CSS.escape(id)}"]`);
  if (b) { b.focus(); return; }
  const rows = [...document.querySelectorAll('#list button[data-open]')];
  if (rows.length) { rows[Math.min(idx < 0 ? 0 : idx, rows.length - 1)].focus(); return; }
  const desc = $('chipDesc'); if (desc) { desc.tabIndex = -1; desc.focus(); }
}

// script id -> what the server said about the last action. 값은 이미 이스케이프된
// HTML 조각입니다. 실패 영수증이 dev() 로 감싼 원문을 함께 실어야 하므로, 넣는
// 쪽에서 esc() 나 errHTML() 을 거치고 그리는 쪽은 그대로 씁니다.
const receipts = {};
async function scriptAction(kind, s, extra) {
  const idx = [...document.querySelectorAll('#list button[data-open]')].findIndex(b => b.dataset.open === s.id);
  document.querySelectorAll('button[data-act]').forEach(b => b.disabled = true);
  receipts[s.id] = '처리 중입니다…';
  render();
  try {
    const r = await fetch(`/api/script/${kind}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: s.id, ...extra }) });
    if (!r.ok) throw await httpFail(r, '요청을 처리하지 못했습니다.');
    const body = await r.json().catch(() => ({}));
    receipts[s.id] = esc(body.message || '');
    toast(kind === 'run' ? '실행을 대기열에 넣었습니다. 결과는 검증 결과 화면에 나옵니다.' : kind === 'approve' ? '승인했습니다.' : '반려했습니다.');
  } catch (e) {
    // 사람이 읽을 한 문장만 남기고 원문은 개발자 정보 모드에서만 보이게 합니다.
    receipts[s.id] = errHTML(e);
    toast(e.message || '요청을 처리하지 못했습니다.');
  }
  // 서버에서 상태와 다음 차례를 다시 읽습니다. 기다리지 않으면 뒤늦게 도착한 응답이
  // 목록을 다시 그리면서 아래에서 잡아 둔 포커스를 지웁니다.
  await poll.refresh();
  render();
  // 누른 버튼은 재렌더로 사라졌습니다. 다음 건으로 이어 가도록 자리를 잡아 줍니다.
  focusAfterAction(s.id, idx);
}

// ---- detail panel: one section per question --------------------------------
// 선택이 실제로 바뀐 순간에만 포커스를 옮기려고 직전 선택을 기억합니다.
// 폴링으로 다시 그릴 때는 같은 id 가 들어오므로 아무 일도 일어나지 않습니다.
let lastDetail = null;
function renderDetail(s) {
  const d = $('detail');
  // Nothing selected: hide the panel and give the whole width to the list, so
  // the rows are never squeezed for a panel no one asked for.
  $('split').classList.toggle('single', !s);
  d.hidden = !s;
  if (!s) { d.innerHTML = ''; lastDetail = null; return; }
  const picked = s.id !== lastDetail;
  lastDetail = s.id;
  const cur = (s.versions || []).find(v => v.current) || (s.versions || [])[0];
  const showV = selectedVersion || (cur && cur.version);
  const links = (s.links || []).map(l => `<span class="st st-muted"><i></i>${esc(LINK[l.LinkType] || l.LinkType)} ${esc(l.LinkValue)}</span>`).join(' ');
  d.innerHTML = `
    <header><h2>${esc(s.title || s.id)}</h2><button class="btn act" id="closeDetail">닫기</button></header>
    <div class="body">
      <section class="sect">
        <h3>요약</h3><p class="sub">이 검사가 무엇이고 지금 어떤 상태인지</p>
        <div class="agent-head">${stTip(STATE, s.state)}${sourceChip(s)}<span class="sub">${esc(CLASS[s.class] || s.class)}</span><span class="sub">브라우저 ${esc(BROWSER[s.browser] || s.browser)}</span><span class="sub">${esc(s.mutation === 'read-only' ? '읽기 전용' : s.mutation === 'reversible' ? '되돌릴 수 있는 변경' : '파괴적 변경')}</span></div>
        <p class="sub next">${esc(nextStep(s, data.daily_at))}</p>
        <dl class="kv">
          <dt>이름</dt><dd class="mono">${esc(s.id)}</dd>
          <dt>판정 근거</dt><dd>${tip(ORACLE[s.oracle] || s.oracle || '없음', GLOSS[s.oracle] || '근거가 없습니다. 실패해도 결함이라 단정할 수 없습니다.')}</dd>
          <dt>검사 이력</dt><dd>${s.runs}회 검사, ${s.passes}회 정상${s.flakes ? `, ${s.flakes}회는 다시 하니 통과` : ''}${s.last_run_at ? ` · 최근 ${ago(s.last_run_at)}` : ''}</dd>
          <dt>다음 검사</dt><dd>${['ACTIVE', 'SOAK'].includes(s.state) ? esc(s.next_due_at ? until(s.next_due_at) + ` (${when(s.next_due_at)})` : '곧') + (s.cadence === 'daily' ? ` · 매일 ${esc(data.daily_at || '')}${s.approved_at ? `, 승인 ${esc(when(s.approved_at))}` : ''}` : '') : '예정 없음'}</dd>
          ${s.source_ref ? `<dt>출처</dt><dd>${esc(s.source_kind === 'issue' ? '이슈' : s.source_kind === 'log' ? '운영 로그' : s.source_kind || '')} <span class="mono">${esc(s.source_ref)}</span></dd>` : ''}
          ${s.locks && s.locks.length ? `<dt>공유 자원</dt><dd>${s.locks.map(esc).join(', ')}</dd>` : ''}
        </dl>
      </section>

      <section class="sect">
        <h3>재현 결과</h3><p class="sub">이슈에 적힌 증상이 실제로 다시 나타났는지</p>
        ${s.reproduction ? `<div class="agent-head">${reproBadge(s)}${s.reproduction.at_step ? `<span class="sub">실행은 ${s.reproduction.at_step}단계에서 멈춤</span>` : ''}${s.reproduction.claimed_step ? `<span class="sub">AI는 ${s.reproduction.claimed_step}단계라고 봄</span>` : ''}</div>
          ${s.reproduction.why ? `<p class="sub">${esc(s.reproduction.why)}</p>` : ''}
          ${s.reproduction.symptom ? `<p class="sub">증상: ${esc(s.reproduction.symptom)}</p>` : ''}
          ${s.last_run_dir ? `<a class="btn" href="/evidence/${esc(s.last_run_dir)}/" target="_blank" rel="noopener">마지막 실행 증거 보기${s.last_run_id ? ` #${s.last_run_id}` : ''}</a>` : ''}`
        : '<div class="empty">이 검사는 이슈 재현에서 나온 것이 아닙니다.</div>'}
      </section>

      <section class="sect">
        <h3>최근 실행 (최대 5회)</h3><p class="sub">언제, 어디서, 어떤 결과였는지</p>
        ${(s.recent_runs || []).length ? `<table class="runs"><caption class="sr-only">최근 실행 기록</caption><tbody>${s.recent_runs.map(r => `<tr>
            <td class="fit">${stTip(OUTCOME, r.outcome)}</td>
            <td><div class="sub">${esc(when(r.finished_at))} (${esc(ago(r.finished_at))}) · ${esc(BROWSER[r.browser] || r.browser)}${r.environment ? ' · 환경 ' + esc(r.environment) : ''}${r.duration_ms ? ' · ' + esc(secs(r.duration_ms)) : ''}</div>
              ${causeHTML(r, 'srun' + r.run_id)}</td>
            <td class="fit">${r.evidence_rel ? `<a class="btn" href="/evidence/${esc(r.evidence_rel)}/" target="_blank" rel="noopener">증거</a>` : ''}</td></tr>`).join('')}</tbody></table>`
          : '<div class="empty">아직 실행 기록이 없습니다. 위의 <b>▶ 실행</b>으로 한 번 돌려 볼 수 있습니다.</div>'}
      </section>

      <section class="sect">
        <h3 id="detFindings" tabindex="-1">발견 사항</h3><p class="sub">화면 값과 서버 응답, 도메인 규칙을 대조해 찾은 이상한 점</p>
        ${findingsHTML(s)}
      </section>

      <section class="sect">
        <details data-key="yaml:${esc(s.id)}">
          <summary><h3>검사 절차 원문</h3><span class="sub">사람이 읽는 YAML입니다. 어떤 순서로 눌러 보는지 확인할 때 펼치세요.</span></summary>
          <div class="versions">${(s.versions || []).map(v => `<button class="${v.version === showV ? 'active' : ''}" data-v="${v.version}" aria-pressed="${v.version === showV}"><span class="who">v${v.version}</span><span>${esc(WHO[v.created_by] || v.created_by)}</span><span class="sub">${esc(v.reason || '')}</span><span class="sub" style="margin-left:auto">${esc(v.created_at)}</span></button>`).join('')}</div>
          <pre class="yaml" id="yaml">${esc(showV === (cur && cur.version) ? s.yaml : '불러오는 중')}</pre>
        </details>
      </section>

      <section class="sect">
        <h3>연결된 기능</h3><p class="sub">이 검사가 지키고 있는 화면과 코드</p>
        <div>${links || '<span class="sub">연결된 기능 정보가 없습니다.</span>'}</div>
      </section>
    </div>`;
  keepDetails(d);
  bindCause(d);
  const close = $('closeDetail');
  if (close) close.onclick = () => { const id = selected; selected = null; syncURL(); render(); const back = document.querySelector(`button[data-open="${CSS.escape(id)}"]`); if (back) back.focus(); };
  d.querySelectorAll('.versions button').forEach(b => b.onclick = () => { selectedVersion = Number(b.dataset.v); rerender(render); });
  if (showV !== (cur && cur.version)) loadVersion(s.id, showV);
  if (picked) revealDetail(d, s);
}

// 발견 사항을 보러 온 사람에게는 그 구역을 먼저 보여 주고, 1100px 이하에서는
// 상세가 목록 아래로 내려가 누름에 반응하지 않은 것처럼 보이므로 제목으로 옮깁니다.
// 넣은 behavior 가 없으므로 움직임 줄이기 설정을 그대로 따릅니다.
function revealDetail(d, s) {
  const narrow = window.matchMedia('(max-width:1100px)').matches;
  const target = (chip === 'FINDINGS' && s.open_findings) ? $('detFindings') : (narrow ? d.querySelector('header h2') : null);
  if (!target) return;
  target.tabIndex = -1;
  target.focus({ preventScroll: true });
  claimScroll(target, { block: 'start' });
}

// ---- findings (data-analyst observations from the Browser Agent) ------------
const FINDING = { data_mismatch: ['데이터 불일치', 'bad'], domain_rule: ['도메인 규칙 위반', 'bad'], display: ['표시 오류', 'warn'], accessibility: ['접근성', 'warn'] };
function findingsHTML(s) {
  const list = s.findings || [];
  if (!list.length) return '<div class="empty">발견된 사항이 없습니다.</div>';
  const open = list.filter(f => f.state === 'OPEN').length;
  return `<p class="sub">${list.length}건${open ? ` (미해결 ${open}건)` : ''} · 확인 후 터미널에서 <span class="mono">vigil findings resolve &lt;번호&gt;</span>로 닫습니다.</p>
    <table class="findings"><caption class="sr-only">발견 사항</caption><tbody>${list.map(f => `<tr${f.state === 'RESOLVED' ? ' class="muted"' : ''}>
      <td class="fit">${st(FINDING, f.kind)}${f.state === 'RESOLVED' ? '<div class="sub"><span class="st st-muted"><i></i>해결됨</span></div>' : ''}</td>
      <td><div class="t">${esc(f.where || '-')}</div>
        <div class="sub">기대 <span class="mono">${esc(f.expected || '-')}</span> · 실제 <span class="mono">${esc(f.actual || '-')}</span></div>
        ${f.evidence ? `<div class="sub">증거: ${esc(f.evidence)}</div>` : ''}
        <div class="sub">${esc(f.created_at)} <span class="dev mono">#${f.id}</span></div></td></tr>`).join('')}</tbody></table>`;
}

// ---- reproduction verdict (three-way: 재현됨 / 판정 불일치 / 재현 안 됨) -------
const REPRO = { confirmed: ['재현됨', 'bad'], disputed: ['판정 불일치', 'warn'], unconfirmed: ['재현 안 됨', 'ok'] };
const reproVerdict = (r) => r.verdict || (r.reproduced ? 'confirmed' : 'unconfirmed');
const reproBadge = (s) => s.reproduction ? stTip(REPRO, reproVerdict(s.reproduction)) : '';

const versionCache = {};
async function loadVersion(id, v) {
  const key = id + '@' + v;
  try {
    if (!versionCache[key]) { const r = await fetch(`/api/script?id=${encodeURIComponent(id)}&v=${v}`); if (!r.ok) throw new Error('HTTP ' + r.status); versionCache[key] = (await r.json()).yaml; }
    const el = $('yaml'); if (el) el.textContent = versionCache[key];
  } catch (e) { const el = $('yaml'); if (el) el.textContent = '원문을 불러오지 못했습니다: ' + e.message; }
}

poll.start();
// 레일 배지는 이 화면의 목록이 아니라 사람이 손대야 할 건수를 말하므로
// /api/todo 를 따로, 드문드문 읽습니다.
railBadgePoll();
</script>
</body>
</html>
